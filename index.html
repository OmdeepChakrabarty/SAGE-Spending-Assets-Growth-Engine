<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SAGE — Spending, Assets &amp; Growth Engine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
  
  <style>
    /* ==========================================================================
       SAGE — Theme & Stylesheet
       ========================================================================== */

    :root {
      --bg-main: #090d16;
      --panel-bg: rgba(17, 24, 39, 0.75);
      --panel-border: rgba(255, 255, 255, 0.08);
      
      --text-main: #f3f4f6;
      --text-muted: #9ca3af;
      --text-dim: #6b7280;
      
      --accent-emerald: #10b981;
      --accent-glow: rgba(16, 185, 129, 0.25);
      --accent-gradient: linear-gradient(135deg, #34d399, #10b981 60%, #059669);
      
      --font-sans: 'Plus Jakarta Sans', system-ui, -apple-system, sans-serif;
      --font-mono: 'JetBrains Mono', monospace;
      
      --radius-lg: 18px;
      --radius-md: 12px;
      --radius-sm: 8px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-main);
      color: var(--text-main);
      font-family: var(--font-sans);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding: 24px;
      position: relative;
      overflow-x: hidden;
    }

    /* Ambient Background Glow */
    .bg-glow {
      position: absolute;
      top: -150px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(circle, var(--accent-glow) 0%, rgba(9,13,22,0) 70%);
      z-index: -1;
      pointer-events: none;
    }

    /* --- Header --- */
    .app-header {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto 20px auto;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .brand-icon {
      width: 44px;
      height: 44px;
      background: var(--accent-gradient);
      color: #000;
      border-radius: var(--radius-md);
      display: grid;
      place-items: center;
      box-shadow: 0 0 20px var(--accent-glow);
    }

    .brand h1 {
      font-size: 1.5rem;
      font-weight: 800;
      letter-spacing: -0.02em;
      background: var(--accent-gradient);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    .brand p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .status-badge {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--accent-emerald);
      background: rgba(16, 185, 129, 0.1);
      border: 1px solid rgba(16, 185, 129, 0.2);
      padding: 6px 12px;
      border-radius: 20px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent-emerald);
      border-radius: 50%;
      box-shadow: 0 0 10px var(--accent-emerald);
    }

    /* --- Layout Grid --- */
    .layout {
      max-width: 1400px;
      width: 100%;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 20px;
      flex: 1;
      height: calc(100vh - 150px);
    }

    /* --- Panels --- */
    .panel {
      background: var(--panel-bg);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-lg);
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.4);
    }

    .panel-header, #db-panel-header {
      padding: 16px 20px;
      border-bottom: 1px solid var(--panel-border);
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(255, 255, 255, 0.02);
    }

    .panel-title {
      display: flex;
      align-items: center;
      gap: 8px;
      font-weight: 600;
      font-size: 0.95rem;
      color: var(--text-main);
    }

    .panel-title svg {
      color: var(--accent-emerald);
    }

    /* --- Chat Panel --- */
    #chat-panel {
      display: flex;
      flex-direction: column;
    }

    #chat-log {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    #chat-log::-webkit-scrollbar,
    #db-table-wrap::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    #chat-log::-webkit-scrollbar-thumb,
    #db-table-wrap::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 10px;
    }

    /* Prompt Example Chips */
    .examples {
      padding: 10px 20px;
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      border-top: 1px solid rgba(255, 255, 255, 0.04);
    }

    .example-chip {
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid var(--panel-border);
      color: var(--text-muted);
      font-family: var(--font-sans);
      font-size: 0.78rem;
      padding: 8px 12px;
      border-radius: 20px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: all 0.2s ease;
    }

    .example-chip:hover {
      background: rgba(16, 185, 129, 0.1);
      border-color: rgba(16, 185, 129, 0.3);
      color: var(--text-main);
      transform: translateY(-1px);
    }

    /* Input Form */
    #chat-form {
      padding: 16px 20px;
      background: rgba(0, 0, 0, 0.2);
      border-top: 1px solid var(--panel-border);
    }

    .input-wrapper {
      display: flex;
      gap: 10px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--panel-border);
      border-radius: var(--radius-md);
      padding: 6px 6px 6px 16px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .input-wrapper:focus-within {
      border-color: var(--accent-emerald);
      box-shadow: 0 0 15px var(--accent-glow);
    }

    #chat-input {
      flex: 1;
      background: transparent;
      border: none;
      outline: none;
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.9rem;
    }

    #chat-input::placeholder {
      color: var(--text-dim);
    }

    #send-btn {
      background: var(--accent-gradient);
      color: #000;
      border: none;
      font-weight: 700;
      font-size: 0.85rem;
      padding: 10px 18px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: transform 0.15s ease, opacity 0.15s ease;
    }

    #send-btn:hover {
      opacity: 0.9;
      transform: scale(1.02);
    }

    /* --- Database Panel --- */
    #db-panel-header h2 {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text-main);
    }

    .count-pill {
      font-size: 0.75rem;
      font-family: var(--font-mono);
      background: rgba(255, 255, 255, 0.08);
      padding: 4px 10px;
      border-radius: 12px;
      color: var(--text-muted);
    }

    #refresh-btn {
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid var(--panel-border);
      color: var(--text-main);
      font-family: var(--font-sans);
      font-size: 0.8rem;
      font-weight: 500;
      padding: 6px 12px;
      border-radius: var(--radius-sm);
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 6px;
      transition: background 0.2s ease;
    }

    #refresh-btn:hover {
      background: rgba(255, 255, 255, 0.12);
    }

    #db-table-wrap {
      flex: 1;
      overflow: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 0.85rem;
    }

    thead th {
      position: sticky;
      top: 0;
      background: #111827;
      color: var(--text-muted);
      font-weight: 600;
      text-transform: uppercase;
      font-size: 0.7rem;
      letter-spacing: 0.05em;
      padding: 12px 16px;
      border-bottom: 1px solid var(--panel-border);
      z-index: 2;
    }

    tbody td {
      padding: 12px 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.03);
      color: var(--text-main);
      white-space: nowrap;
    }

    tbody tr:hover {
      background: rgba(255, 255, 255, 0.03);
    }

    tbody td:nth-child(1) { font-family: var(--font-mono); color: var(--text-dim); }
    tbody td:nth-child(2) { font-family: var(--font-mono); color: var(--text-muted); }
    tbody td:nth-child(4) { font-family: var(--font-mono); font-weight: 600; color: var(--accent-emerald); }

    /* --- Footer --- */
    footer {
      max-width: 1400px;
      width: 100%;
      margin: 16px auto 0 auto;
      text-align: center;
      font-size: 0.78rem;
      color: var(--text-dim);
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
    }

    footer code {
      font-family: var(--font-mono);
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.05);
      padding: 2px 6px;
      border-radius: 4px;
    }

    .pulse-icon {
      width: 6px;
      height: 6px;
      background-color: var(--accent-emerald);
      border-radius: 50%;
      display: inline-block;
      box-shadow: 0 0 8px var(--accent-emerald);
    }

    @media (max-width: 960px) {
      body { padding: 16px; }
      .layout {
        grid-template-columns: 1fr;
        height: auto;
      }
      #chat-panel { height: 500px; }
      #db-panel { height: 400px; }
    }
  </style>
</head>
<body>
  <div class="bg-glow"></div>

  <header class="app-header">
    <div class="brand">
      <div class="brand-icon">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2v20M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>
      </div>
      <div>
        <h1>SAGE</h1>
        <p>Spending, Assets &amp; Growth Engine</p>
      </div>
    </div>
    <div class="status-badge">
      <span class="status-dot"></span>
      Engine Live
    </div>
  </header>

  <main class="layout">
    <!-- Chat panel -->
    <section class="panel" id="chat-panel">
      <div class="panel-header">
        <div class="panel-title">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/></svg>
          Assistant Chat
        </div>
      </div>

      <div id="chat-log"></div>

      <div class="examples" id="examples">
        <button class="example-chip" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12h14M12 5l7 7-7 7"/></svg>
          How much did I spend on dining out in December?
        </button>
        <button class="example-chip" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 3v18h18"/><path d="m19 9-5 5-4-4-3 3"/></svg>
          Show me my spending by category as a chart.
        </button>
        <button class="example-chip" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 5v14M5 12h14"/></svg>
          Add $45 dining out charge at Local Diner on 2025-07-10.
        </button>
        <button class="example-chip" type="button">
          <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          Did I spend anything on travel in March 2025?
        </button>
      </div>

      <form id="chat-form">
        <div class="input-wrapper">
          <input
            id="chat-input"
            type="text"
            autocomplete="off"
            placeholder="Ask SAGE about transactions or edit data..."
          />
          <button id="send-btn" type="submit">
            <span>Send</span>
            <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
          </button>
        </div>
      </form>
    </section>

    <!-- Database panel -->
    <section class="panel" id="db-panel">
      <div id="db-panel-header">
        <div class="panel-title">
          <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M21 12c0 1.66-4 3-9 3s-9-1.34-9-3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/></svg>
          Live Transactions
        </div>
        <div style="display: flex; align-items: center; gap: 12px;">
          <span id="db-count" class="count-pill">0 items</span>
          <button id="refresh-btn" type="button" title="Refresh Table">
            <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/></svg>
            Refresh
          </button>
        </div>
      </div>
      
      <div id="db-table-wrap">
        <table>
          <thead>
            <tr>
              <th>ID</th>
              <th>Date</th>
              <th>Merchant</th>
              <th>Amount</th>
              <th>Category</th>
            </tr>
          </thead>
          <tbody id="db-table-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <footer>
    <span class="pulse-icon"></span>
    <code>transactions.db</code> live sync active — auto-refreshes on every turn
  </footer>

  <script src="/app.js"></script>
</body>
</html>
